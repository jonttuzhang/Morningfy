# Builds the iPhone app on a GitHub-hosted Mac, so no Mac of your own is needed.
# Output: an unsigned Morningfy.ipa under the run's "Artifacts". It must be signed
# (e.g. with Sideloadly and your Apple ID, or later via TestFlight) before it installs.
name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm ios:sync
      - name: Build app (unsigned)
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -target App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build
      - name: Package Morningfy.ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/App.app Payload/
          zip -qr Morningfy.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Morningfy-unsigned-ipa
          path: Morningfy.ipa
          retention-days: 30
